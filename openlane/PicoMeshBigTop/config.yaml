DESIGN_NAME: PicoMeshBigTop
VERILOG_FILES:
  - dir::../../verilog/rtl/picorv32.v
  - dir::../../verilog/rtl/CaravelUserProject.v

VDD_NETS: ["vccd1"]
GND_NETS: ["vssd1"]

CLOCK_PORT: clock
CLOCK_PERIOD: 100

TIMING_VIOLATION_CORNERS: []

FP_PDN_MULTILAYER: true
FP_PDN_CORE_RING: true

#GRT_RESIZER_HOLD_SLACK_MARGIN: 0.1
#PL_RESIZER_HOLD_SLACK_MARGIN: 0.3

DESIGN_REPAIR_MAX_SLEW_PCT: 13
DESIGN_REPAIR_MAX_CAP_PCT: 13
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 13
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 13

GRT_ANTENNA_MARGIN: 30
RUN_ANTENNA_REPAIR: true
GRT_ANTENNA_ITERS: 40

RT_MAX_LAYER: met4


HEURISTIC_ANTENNA_THRESHOLD: 110
RUN_HEURISTIC_DIODE_INSERTION: true

DPL_CELL_PADDING: 2
GPL_CELL_PADDING: 2

MAGIC_CAPTURE_ERRORS: false
PRIMARY_GDSII_STREAMOUT_TOOL: "klayout"
RUN_KLAYOUT_DRC: true
RUN_MAGIC_DRC: false
RUN_KLAYOUT_XOR: false


GRT_ALLOW_CONGESTION: true

PL_TARGET_DENSITY_PCT: 47
FP_CORE_UTIL: 47
FP_PIN_ORDER_CFG: dir::pin_order.cfg
FP_SIZING: absolute
DIE_AREA: [0, 0, 2700, 1190]
#DIE_AREA: [0, 0, 2700, 1800]
#SYNTH_AUTONAME: true
#PL_MAX_PHI_COEFFICIENT: 1.07

FP_PDN_HPITCH: 135
FP_PDN_VPITCH: 135

ERROR_ON_LVS_ERROR: false

MACROS:
  sky130_sram_1kbyte_1rw1r_32x256_8:
    instances:
      mesh.memLow.mem:
        location: [50, 20]
        orientation: FS
      mesh.memHigh.mem:
        location: [570, 20]
        orientation: S
    gds: dir::../../gds/sky130_sram_1kbyte_1rw1r_32x256_8.gds
    lef: pdk_dir::libs.ref/sky130_sram_macros/lef/sky130_sram_1kbyte_1rw1r_32x256_8.lef
    nl: pdk_dir::libs.ref/sky130_sram_macros/verilog/sky130_sram_1kbyte_1rw1r_32x256_8.v
PDN_MACRO_CONNECTIONS:
  - "mesh.memLow.mem vccd1 vssd1 vccd1 vssd1"
  - "mesh.memHigh.mem vccd1 vssd1 vccd1 vssd1"
